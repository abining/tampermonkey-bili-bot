name: Release userscript

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript
        run: pnpm build

      - name: Verify userscript artifact
        shell: bash
        run: |
          artifact="dist/bilibili-video-summary-beta.user.js"
          version="${GITHUB_REF_NAME#v}"
          release_asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/bilibili-video-summary-beta.user.js"

          test -f "${artifact}"
          grep -Fq "// @version      ${version}" "${artifact}"
          grep -Fq "// @downloadURL  ${release_asset_url}" "${artifact}"
          grep -Fq "// @updateURL    ${release_asset_url}" "${artifact}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="dist/bilibili-video-summary-beta.user.js"
          release_args=(
            --repo "${GITHUB_REPOSITORY}"
            --title "${GITHUB_REF_NAME}"
            --generate-notes
            --latest
            --verify-tag
          )

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease=false \
              --latest
            gh release upload "${GITHUB_REF_NAME}" "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${artifact}" "${release_args[@]}"
          fi
